<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Calendar Base -->
  <g filter="url(#shadow)">
    <!-- Calendar Body -->
    <rect x="86" y="116" width="340" height="310" rx="40" fill="#ffffff" />
    
    <!-- Calendar Header Strip -->
    <path d="M 86,156 A 40,40 0 0,1 126,116 L 386,116 A 40,40 0 0,1 426,156 L 426,190 L 86,190 Z" fill="#ef4444" />
    
    <!-- Ring Binders -->
    <rect x="150" y="86" width="24" height="60" rx="12" fill="#334155" />
    <rect x="338" y="86" width="24" height="60" rx="12" fill="#334155" />

    <!-- Calendar Grid Dots / Health Cross -->
    <!-- Heart & Health Symbol in Center -->
    <path d="M 256,360 C 256,360 170,300 170,245 C 170,220 190,205 215,205 C 235,205 250,218 256,228 C 262,218 277,205 297,205 C 322,205 342,220 342,245 C 342,300 256,360 256,360 Z" fill="#ef4444" />

    <!-- Pulse Line -->
    <path d="M 195,255 L 230,255 L 245,230 L 260,280 L 275,250 L 290,255 L 315,255" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
